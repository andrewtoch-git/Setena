<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Recuperar contraseña</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/appmusic/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
input::placeholder,textarea::placeholder{color:var(--on-surface-variant)}
.dc-noscroll{scrollbar-width:none}.dc-noscroll::-webkit-scrollbar{display:none}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
input:focus,textarea:focus{outline:2px solid var(--acento);outline-offset:-2px;caret-color:var(--acento)}
input[aria-invalid="true"]:focus,textarea[aria-invalid="true"]:focus{outline-color:var(--error)}
.accion{transition:box-shadow .15s}
.accion:hover{box-shadow:inset 0 0 0 999px color-mix(in srgb,var(--on-accion-destacada) 8%,transparent)}
.accion:active{box-shadow:inset 0 0 0 999px color-mix(in srgb,var(--on-accion-destacada) 10%,transparent)}
.accion:disabled,.accion[aria-disabled="true"]{background:color-mix(in srgb,var(--on-surface) 12%,transparent)!important;color:color-mix(in srgb,var(--on-surface) 38%,transparent)!important;box-shadow:none;cursor:default}
</style>
</helmet>
<div data-theme="{{tema}}" style="width: 402px; height: 874px; box-sizing: border-box; background: var(--surface); font-family: var(--font-brand); color: var(--on-surface); display: flex; flex-direction: column; overflow: hidden; position: relative">
<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 64px 16px 24px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; height: 44px">
<a href="Iniciar-sesion.dc.html" aria-label="Volver" style="flex: none; width: 28px; height: 44px; display: flex; align-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block; color: var(--on-surface)"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
</div>
<h1 style="margin: 6px 0 0; font-size: 24px; font-weight: 400">Recuperar contraseña</h1>
<sc-if value="{{pendiente}}" hint-placeholder-val="{{true}}">
<p style="margin: 0 0 4px; font-size: 14px; line-height: 1.3; color: var(--on-surface-variant)">Escribe el correo de tu cuenta y te enviaremos un enlace para crear una contraseña nueva.</p>
<div style="display: flex; flex-direction: column; gap: 6px; position: relative">
<label for="rc-correo" style="position: absolute; top: -8px; left: 12px; z-index: 1; padding: 0 4px; background: var(--field-bg, var(--surface)); font: 400 12px/16px var(--font-brand); letter-spacing: 0.4px; color: var(--on-surface-variant); pointer-events: none; text-align: left">Correo electrónico</label>
<input id="rc-correo" type="email" placeholder="nombre@correo.com" value="{{correo}}" onChange="{{onCorreo}}" aria-invalid="{{eCorreo}}" style="height: 56px; box-sizing: border-box; border-radius: 4px; padding: 0 16px; font: 400 16px var(--font-brand); border: {{bCorreo}}; background: transparent; color: var(--on-surface)">
<sc-if value="{{eCorreo}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 400; color: var(--error)">{{correoMsg}}</span></sc-if>
</div>
<button class="accion" onClick="{{enviar}}" style="margin-top: 4px; width: 100%; height: 40px; border: none; border-radius: 999px; background: var(--accion-destacada); font: 500 14px var(--font-brand); color: var(--on-accion-destacada); cursor: pointer">Enviar enlace</button>
</sc-if>
<sc-if value="{{hecho}}" hint-placeholder-val="{{false}}">
<div role="status" style="flex: none; background: var(--surface-container-high); border-radius: 12px; padding: 32px 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<span aria-hidden="true" style="width: 52px; height: 52px; box-sizing: border-box; border-radius: 50%; border: 2px solid var(--acento); background: transparent; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block; color: var(--acento)"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<span style="font-size: 16px; font-weight: 500">Revisa tu correo</span>
<span style="font-size: 14px; line-height: 1.35; color: var(--on-surface-variant)">Si {{correo}} tiene una cuenta, recibirás un enlace para crear una contraseña nueva.</span>
</div>
<a class="accion" href="Iniciar-sesion.dc.html" style="height: 40px; border-radius: 999px; background: var(--accion-destacada); color: var(--on-accion-destacada); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500">Volver a iniciar sesión</a>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 402, "height": 874}}'>

this.__v = __pv();

__rvBase() {

</script>
</body>
</html>
