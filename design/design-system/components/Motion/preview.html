<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Motion</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&amp;display=block"></head><body><div class="pv" style="gap:6px" id="m"></div>
<script>
var S=[["spatial-fast",0.9,1400],["spatial-default",0.9,700],["spatial-slow",0.9,300],["effects-fast",1,3800],["effects-default",1,1600],["effects-slow",1,800],["expressive-spatial-fast",0.6,800]];
var m=document.getElementById('m');
S.forEach(function(s){var r=document.createElement('button');r.className='sl';r.style.cssText='display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--on-surface);padding:6px 8px;border-radius:8px;cursor:pointer;font:400 13px/20px var(--font-brand);text-align:left';r.innerHTML='<span style="width:200px">spring-'+s[0]+'</span><span style="width:84px;color:var(--on-surface-variant)">'+s[1]+' · '+s[2]+'</span><span style="position:relative;flex:1;height:24px;border-radius:12px;background:var(--surface-container-high);min-width:160px"><i style="position:absolute;left:0;top:2px;width:20px;height:20px;border-radius:50%;background:var(--primary)"></i></span>';m.appendChild(r);var dot=r.querySelector('i'),bar=r.querySelector('span:last-child'),at=0;
r.onclick=function(){var x=at,v=0,target=at?0:1;at=target;var k=s[2],c=2*s[1]*Math.sqrt(k),last=performance.now();var W=bar.clientWidth-24;(function f(n){var dt=Math.min(.032,(n-last)/1000);last=n;for(var i=0;i<4;i++){var a=-k*(x-target)-c*v;v+=a*dt/4;x+=v*dt/4}dot.style.transform='translateX('+(x*W)+'px)';if(Math.abs(x-target)>0.001||Math.abs(v)>0.01)requestAnimationFrame(f);else dot.style.transform='translateX('+(target*W)+'px)'})(last)}});
</script></body></html>
