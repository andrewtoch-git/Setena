<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Contraste</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700&amp;display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&amp;display=block"></head><body><div class="pv"><div class="pv-cap">Modo oscuro · pares comprobados en vivo</div><div id="t" style="display:grid;grid-template-columns:1fr auto auto;gap:4px 16px;font:400 13px/20px var(--font-brand)"></div></div>
<script>
var P=[["on-accion-destacada","accion-destacada"],["acento","surface"],["acento","surface-container"],["on-acento","acento"],["on-secondary-container","secondary-container"],["on-secondary-container","secondary-container-alto"],["secondary","surface-container"],["on-surface","surface"],["on-surface","surface-container-high"],["on-surface","surface-container-highest"],["on-surface-variant","surface"],["on-surface-variant","surface-container-highest"],["inverse-on-surface","inverse-surface"],["on-error","error"],["error","surface"],["on-error-container","error-container"],["on-primary","primary"],["on-surface-variant","surface-variant"],["outline","surface",3]];
function L(h){h=h.trim().replace('#','');var c=[0,2,4].map(function(i){var x=parseInt(h.substr(i,2),16)/255;return x<=0.03928?x/12.92:Math.pow((x+0.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function draw(){var cs=getComputedStyle(document.documentElement),t=document.getElementById('t'),h='';P.forEach(function(p){var a=cs.getPropertyValue('--'+p[0]),b=cs.getPropertyValue('--'+p[1]);if(!a||!b)return;var la=L(a),lb=L(b),r=(Math.max(la,lb)+.05)/(Math.min(la,lb)+.05),min=p[2]||4.5,ok=r>=min;h+='<span style="display:flex;gap:8px;align-items:center"><span style="width:56px;height:20px;border-radius:4px;background:var(--'+p[1]+');color:var(--'+p[0]+');font:500 11px/20px var(--font-brand);text-align:center;box-shadow:inset 0 0 0 1px var(--outline-variant)">Aa</span>'+p[0]+' / '+p[1]+'</span><b style="text-align:right;font-variant-numeric:tabular-nums">'+r.toFixed(2)+':1</b><span style="color:'+(ok?'var(--on-surface)':'var(--error)')+'">'+(ok?'Cumple '+min:'No cumple '+min)+'</span>'});t.innerHTML=h}
draw();
</script></body></html>
