<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Boton</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700&amp;display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&amp;display=block"></head><body><div class="pv"><div class="pv-cap">Variantes (S)</div><div class="pv-row"><button class="btn filled sl">Ver perfil</button><button class="btn tonal sl"><span class="ms fill " aria-hidden="true">favorite</span>Favorito</button><button class="btn outlined acento sl">Regístrate</button><button class="btn outlined sl">Chat</button><button class="btn text sl">Cancelar</button><button class="btn danger filled sl">Eliminar cuenta</button></div>
<div class="pv-cap">Tarjetas de Explorar: «Ver perfil» relleno en cada tarjeta (excepción a «un relleno por pantalla»)</div><div class="pv-row"><button class="btn outlined sl" style="width:160px">Chat</button><button class="btn filled sl" style="width:160px">Ver perfil</button></div>
<div class="pv-cap">Estados: enabled · hovered · focused · pressed · disabled</div><div class="pv-row"><button class="btn filled sl">Guardar</button><button class="btn filled sl is-hover">Guardar</button><button class="btn filled sl is-focus">Guardar</button><button class="btn filled sl is-pressed">Guardar</button><button class="btn filled is-disabled" disabled>Guardar</button><button class="btn outlined is-disabled" disabled>Chat</button></div>
<div class="pv-cap">Tamaños XS · S · M (redondo)</div><div class="pv-row" style="align-items:flex-end"><button class="btn filled xs sl">Chat</button><button class="btn filled s sl">Chat</button><button class="btn filled m sl"><span class="ms " aria-hidden="true">chat_bubble</span>Chat</button></div>
<div class="pv-cap">Cuadrado S · M</div><div class="pv-row"><button class="btn outlined square sl">Editar perfil</button><button class="btn filled m square sl">Guardar cambios</button></div></div></body></html>
