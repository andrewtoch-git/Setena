<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Dialogo</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&amp;display=block"></head><body><div class="pv"><div class="pv-row" style="align-items:flex-start"><div class="scrim" style="border-radius:var(--corner-medium);width:340px"><div class="dialog"><h3>¿Bloquear a Marta Ruiz?</h3><p>No podrá enviarte mensajes ni ver tu perfil. No le avisaremos de que le has bloqueado.</p><div class="acts"><button class="btn text sl">Cancelar</button><button class="btn danger sl">Bloquear</button></div></div></div>

<div class="scrim" style="border-radius:var(--corner-medium);width:340px"><div class="dialog"><h3>Más opciones</h3><ul class="list"><li class="li one sl"><span class="ms " aria-hidden="true">flag</span><span class="tx"><span class="h">Denunciar perfil</span></span></li><li class="li one sl"><span class="ms " aria-hidden="true">block</span><span class="tx"><span class="h">Bloquear a Marta Ruiz</span></span></li></ul><div class="acts"><button class="btn text sl">Cancelar</button></div></div></div></div></div></body></html>
